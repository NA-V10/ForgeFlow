[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeflow-api"
version = "0.1.0"
description = "ForgeFlow control plane API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "alembic>=1.13", "pydantic>=2.6",
  "pydantic-settings>=2.2", "pyyaml>=6", "redis>=5", "websockets>=12",
  "ff-version", "ff-semantic", "ff-risk", "ff-policy", "ff-provenance", "ff-sandbox", "ff-merge",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forgeflow_api = ["migrations/*", "migrations/versions/*"]
